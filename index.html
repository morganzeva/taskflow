<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow, une application simple pour organiser ses tâches.">
  <title>TaskFlow — Gestionnaire de tâches</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">TF</div>
      <div>
        <p class="eyebrow">ORGANISATION PERSONNELLE</p>
        <h1>TaskFlow</h1>
        <p class="subtitle">Une chose après l’autre. Tu avances.</p>
      </div>
    </header>

    <section class="panel" aria-labelledby="add-title">
      <h2 id="add-title">Ajouter une tâche</h2>
      <form id="taskForm" class="add-form">
        <label class="sr-only" for="taskInput">Nom de la tâche</label>
        <input id="taskInput" type="text" maxlength="100" placeholder="Ex. Réviser les maths..." autocomplete="off" required>
        <button class="primary-button" type="submit">Ajouter</button>
      </form>
      <p id="formMessage" class="message" aria-live="polite"></p>
    </section>

    <section class="task-section" aria-labelledby="list-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">TON ESPACE</p>
          <h2 id="list-title">Mes tâches</h2>
        </div>
        <p id="counter" class="counter">0 tâche restante</p>
      </div>

      <nav class="filters" aria-label="Filtrer les tâches">
        <button class="filter active" type="button" data-filter="all" aria-pressed="true">Toutes</button>
        <button class="filter" type="button" data-filter="todo" aria-pressed="false">En cours</button>
        <button class="filter" type="button" data-filter="done" aria-pressed="false">Terminées</button>
      </nav>

      <ul id="taskList" class="task-list"></ul>
      <p id="emptyState" class="empty-state">Aucune tâche ici pour le moment. Ajoute ta première tâche !</p>
    </section>

    <footer>
      <span>TaskFlow</span>
      <span>Projet personnel — HTML, CSS & JavaScript</span>
    </footer>
  </main>
</body>
</html>
